spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/task-db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,beans,conditions

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
